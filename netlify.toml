# Netlify auto-deploy config — the site root is the web/ subfolder.
# Connect via: Netlify → Add new site → Import from Git → pick CVMaker repo.

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback (share pages /r/:slug)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
